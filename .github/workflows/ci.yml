# Pull requests and main: the same `pnpm check` maintainers run before merging (frozen install,
# typecheck, lint, policy matrix, tests) on all three desktop platforms (DCO sign-off: dco.yml).
# `pnpm verify` (build, renderer smoke test, end-to-end suites) still runs on a maintainer's
# machine before merge: it starts Electron windows and needs a desktop session.
name: CI

# Changes that touch only the user guide, its images and assets, the READMEs or the license files
# skip the platform checks (they ran 15–30 min on three runners for text). Prompt markdown and
# AGENTS.md are code inputs that `pnpm lint` checks, so they are not ignored. The DCO sign-off
# lives in dco.yml so documentation-only pull requests are still checked.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - "NOTICE"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.*.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS runners are the slowest (about 50 minutes for pnpm check); leave headroom.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm check

  build-smoke:
    name: build & smoke (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Renderer & owner smoke
        run: |
          xvfb-run -a pnpm --filter @pibot/desktop smoke:renderer
          pnpm --filter @pibot/desktop smoke:owner
